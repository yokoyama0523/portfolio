<a class="stream-card" href="{{url}}" data-parallax>
  <span class="stream-img"><img src="{{thumb}}" alt="" width="960" height="600" loading="lazy" decoding="async"></span>
  <span class="stream-meta"><span class="stream-no">{{no}}</span><b>{{name}}</b><span>{{industry}}</span></span>
  <span class="chips" aria-hidden="true">{{{chips}}}</span>
</a>
