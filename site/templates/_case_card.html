<article class="case" data-cat="{{category}}" id="{{id}}" data-reveal>
  <a class="case-media" href="{{url}}" target="_blank" rel="noopener" aria-label="{{name}} を開く（新しいタブ）">
    <img class="case-pc" src="{{thumb}}" alt="" width="960" height="600" loading="lazy" decoding="async">
    <img class="case-sp" src="{{mobile}}" alt="" loading="lazy" decoding="async">
  </a>
  <div class="case-body">
    <p class="case-no">{{no}}<span>{{category}}</span></p>
    <h2 class="case-name">{{name}}</h2>
    <p class="case-ind">{{industry}}　{{pages}}ページ</p>
    <p class="case-sum">{{summary}}</p>
    <ul class="case-feat">{{{features}}}</ul>
    <p class="case-tech">{{{tech}}}</p>
    <div class="case-foot">
      <span class="chips" aria-label="配色">{{{chips}}}</span>
      <a class="link-line" href="{{url}}" target="_blank" rel="noopener">サイトを開く</a>
    </div>
  </div>
</article>
