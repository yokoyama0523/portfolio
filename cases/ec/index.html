<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASAGI｜毎日着る、ふつうの服。</title>
<meta name="description" content="ASAGI 公式オンラインストア。日本製の定番の服と小物。11,000円以上で送料無料。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"><link rel="stylesheet" href="site.css"><script src="data.js"></script><script src="store.js"></script>
<style>
.hero{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px var(--gut) 0}
.hero figure{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--bg)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.hero .cap{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 0;gap:16px;flex-wrap:wrap}
.hero .cap h1{font-size:clamp(18px,2.2vw,26px);font-weight:500;letter-spacing:.06em}
.hero .cap a{font-size:12.5px;border-bottom:1px solid var(--ink);padding-bottom:2px}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.cats a{display:block}.cats .im{aspect-ratio:1;background:var(--bg);overflow:hidden}.cats img{width:100%;height:100%;object-fit:cover}.cats b{display:block;font-weight:500;font-size:13px;margin-top:8px}
.rank{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;counter-reset:r}
.rank .card::before{content:counter(r);counter-increment:r;position:absolute;left:0;top:0;z-index:2;width:28px;height:28px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:'Inter',var(--f);font-weight:700;font-size:13px}
.rank .card .tag{display:none}
.looks{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.looks figure{position:relative}.looks .im{aspect-ratio:3/4;overflow:hidden;background:var(--bg)}.looks img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.looks figcaption{margin-top:8px;font-size:12.5px}.looks figcaption b{font-weight:500;display:block}
.looks .items{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}.looks .items a{font-size:11.5px;color:var(--mute);border-bottom:1px solid var(--line)}.looks .items a:hover{color:var(--ink)}
.news li{display:grid;grid-template-columns:7em 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.news li:last-child{border-bottom:1px solid var(--line)}.news time{color:var(--mute);font-size:12px}
.member{background:var(--bg);padding:clamp(32px,5vw,56px);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.member h2{font-size:clamp(18px,2vw,24px);font-weight:500;letter-spacing:.04em}.member p{margin-top:6px}.member code{font-family:'Inter',var(--f);font-weight:700;background:#fff;padding:2px 8px;border:1px solid var(--line)}
.ship{display:flex;gap:28px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
@media (max-width:900px){.hero{grid-template-columns:1fr 1fr}.hero figure{aspect-ratio:3/4}.cats{grid-template-columns:repeat(3,1fr)}.rank{grid-template-columns:repeat(2,1fr)}.looks{grid-template-columns:1fr 1fr}.member{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="hd"></div>
<main>
<div class="wrap ship"><span>11,000円以上で送料無料</span><span>15時までのご注文は当日発送</span><span>返品・交換は到着後14日以内</span></div>
<section class="hero" aria-label="新作">
  <figure><img src="assets/look-10.jpg" alt="赤いニットにコートを羽織った女性" width="1200" height="1500"></figure>
  <figure><img src="assets/look-12.jpg" alt="黒のコートにマフラーの女性" width="1200" height="1500"></figure>
  <div class="cap"><h1>2026 秋冬　コートとニットが入荷しました。</h1><a href="list.html?new=1">新着をすべて見る</a></div>
</section>
<section class="sec wrap" id="new"><div class="h"><h2>新着</h2><a href="list.html?new=1">すべて見る</a></div><div class="grid" id="newgrid"></div></section>
<section class="sec wrap" style="padding-top:0"><div class="h"><h2>カテゴリー</h2></div><div class="cats" id="cats"></div></section>
<section class="sec wrap" style="padding-top:0"><div class="h"><h2>ランキング</h2><a href="list.html?sort=rank">すべて見る</a></div><div class="rank" id="rank"></div></section>
<section class="sec wrap" id="looks" style="padding-top:0"><div class="h"><h2>ルックブック</h2></div><div class="looks" id="lookgrid"></div></section>
<section class="sec wrap" style="padding-top:0"><div class="member"><div><h2>会員登録で、初回10%OFF。</h2><p>登録のあと、レジでクーポンコード <code>WELCOME10</code> を入れてください。注文履歴とお届け先の保存も使えます。</p></div><a class="btn" href="account.html#register">会員登録（無料）</a></div></section>
<section class="sec wrap" style="padding-top:0"><div class="h"><h2>お知らせ</h2></div><ul class="news" id="news"></ul></section>
</main>
<div id="ft"></div>
<script>
const catImg={tops:'knit-beige',bottoms:'jeans-indigo',outer:'coat-camel',onepiece:'dress-pink',acc:'tote-natural',shoes:'sneaker-white2'};
q('#newgrid').innerHTML=PRODUCTS.filter(p=>p.new).slice(0,8).map(p=>card(p)).join('');
q('#cats').innerHTML=CATS.map(c=>`<a href="list.html?cat=${c.id}"><div class="im"><img src="${img(catImg[c.id])}" alt="" width="600" height="600" loading="lazy"></div><b>${c.name}</b></a>`).join('');
q('#rank').innerHTML=[...PRODUCTS].sort((a,b)=>a.rank-b.rank).slice(0,5).map(p=>card(p)).join('');
q('#lookgrid').innerHTML=LOOKS.map(l=>`<figure><div class="im"><img src="${img(l.img)}" alt="${esc(l.title)}" width="900" height="1200" loading="lazy"></div><figcaption><b>${esc(l.title)}</b><div class="items">${l.items.map(id=>`<a href="item.html?id=${id}">${esc(P[id].name)}</a>`).join('')}</div></figcaption></figure>`).join('');
q('#news').innerHTML=NEWS.map(([d,t])=>`<li><time>${d}</time><span>${esc(t)}</span></li>`).join('');
bindWish();
</script>
</body>
</html>
