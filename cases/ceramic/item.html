<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うつわ｜土と火</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500&family=Zen+Kaku+Gothic+Antique:wght@300;400;500&display=swap">
<style>
:root{--clay:#fff;--white:#f4f3f0;--sumi:#2b2b2b;--sumi-2:#6e6d69;--line:rgba(43,43,43,.16);--ai:#2f4a7a;--min:'Zen Old Mincho',serif;--got:'Zen Kaku Gothic Antique',sans-serif;--gut:clamp(20px,6vw,88px)}
*{box-sizing:border-box}
body{margin:0;background:var(--clay);color:var(--sumi);font-family:var(--got);font-weight:300;font-size:13px;line-height:2.1;letter-spacing:.06em;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--ai);outline-offset:3px}h1,h2,h3{margin:0;font-weight:400}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
.v{writing-mode:vertical-rl;font-feature-settings:"vpal" 1}
.hd{display:flex;justify-content:space-between;align-items:center;padding:24px var(--gut);font-size:11.5px;letter-spacing:.2em}
.hd .logo{font-family:var(--min);font-size:20px;letter-spacing:.3em}.hd nav{display:flex;gap:26px}
.crumb{padding:0 var(--gut);font-size:11px;letter-spacing:.16em;color:var(--sumi-2)}.crumb a:hover{text-decoration:underline}
.item{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(28px,6vw,96px);padding:40px var(--gut) 80px;align-items:start}
.gal .main{aspect-ratio:1;overflow:hidden;background:var(--white)}.gal .main img{width:100%;height:100%;object-fit:cover}
.gal .thumbs{display:flex;gap:10px;margin-top:12px}.gal .thumbs button{width:72px;aspect-ratio:1;overflow:hidden;border:1px solid transparent;padding:0}.gal .thumbs button.on{border-color:var(--sumi)}.gal .thumbs img{width:100%;height:100%;object-fit:cover}
.info{position:sticky;top:24px}
.info .col{display:flex;gap:28px;align-items:flex-start}
.info .kan{font-family:var(--min);font-size:24px;line-height:1;padding-bottom:22px;position:relative}.info .kan::after{content:"";position:absolute;left:50%;bottom:0;width:1px;height:16px;background:var(--sumi)}
.info h1{font-family:var(--min);font-size:clamp(26px,3vw,36px);letter-spacing:.22em;line-height:1.3;white-space:nowrap}.info h1 small{display:block;font-family:var(--got);font-size:11px;letter-spacing:.24em;color:var(--sumi-2);margin-left:1em;padding-top:.3em}
.info .txt{max-width:30em}
.info .price{font-family:var(--min);font-size:28px;letter-spacing:.06em;margin:22px 0 4px}.info .price small{font-family:var(--got);font-size:11px;color:var(--sumi-2);margin-left:6px;letter-spacing:.12em}
.info .stock{font-size:11.5px;color:var(--sumi-2);letter-spacing:.14em;margin-bottom:20px}.info .stock.few{color:var(--ai)}
.buy{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:8px 0 28px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--sumi)}.qty button{width:40px;height:44px}.qty input{width:48px;height:44px;border:0;background:transparent;text-align:center;font:inherit;color:inherit;-moz-appearance:textfield}.qty input::-webkit-inner-spin-button{display:none}
.add{background:var(--sumi);color:var(--white);padding:0 32px;height:44px;font-size:11.5px;letter-spacing:.24em}
.info dl{margin:0 0 20px;display:grid;grid-template-columns:5em 1fr;gap:4px 14px;font-size:12px;border-top:1px solid var(--line);padding-top:16px}.info dt{color:var(--sumi-2)}.info dd{margin:0}
.info p{margin:0 0 1.2em}.info .care{font-size:12px;color:var(--sumi-2);border-top:1px solid var(--line);padding-top:14px}
.rel{padding:0 var(--gut) 100px}.rel h2{font-family:var(--min);font-size:20px;letter-spacing:.24em;margin-bottom:28px}
.rel .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}.rel a .im{aspect-ratio:1;overflow:hidden;background:var(--white)}.rel a img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1)}.rel a:hover img{transform:scale(1.04)}
.rel a b{font-family:var(--min);font-weight:400;font-size:14px;letter-spacing:.16em;display:block;margin-top:10px;line-height:1.5}.rel a small{font-size:11px;color:var(--sumi-2)}
.ft{padding:48px var(--gut) 64px;border-top:1px solid var(--line);font-size:11px;letter-spacing:.16em;color:var(--sumi-2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px 40px}.ft .logo{font-family:var(--min);font-size:18px;letter-spacing:.3em;color:var(--sumi)}
@media (max-width:900px){.item{grid-template-columns:1fr}.info{position:static}.info h1{writing-mode:horizontal-tb;white-space:normal}.info .kan{padding:0}.info .kan::after{display:none}.info .col{align-items:baseline}.rel .grid{grid-template-columns:repeat(2,1fr)}.hd nav{display:none}}
</style>
</head>
<body>
<header class="hd"><a class="logo" href="./">土と火</a><nav><a href="./#pieces">うつわ</a><a href="./#makers">作り手</a><a href="./#care">手入れ</a><a href="./#guide">ご案内</a></nav><a href="#" data-cart-open>かご（<span data-cart-count>0</span>）</a></header>
<div class="crumb"><a href="./">土と火</a>　／　<a href="./#pieces">うつわ</a>　／　<span id="cname"></span></div>
<main>
<section class="item">
  <div class="gal"><div class="main"><img id="mainimg" src="" alt="" width="1280" height="853"></div><div class="thumbs" id="thumbs"></div></div>
  <div class="info">
    <div class="col"><div class="kan" id="kan"></div><h1 class="v" id="h1"></h1></div>
    <div class="txt">
      <div class="price" id="price"></div><div class="stock" id="stock"></div>
      <div class="buy"><div class="qty"><button type="button" id="dec" aria-label="減らす">−</button><input type="number" id="q" value="1" min="1" max="1"><button type="button" id="inc" aria-label="増やす">＋</button></div><button type="button" class="add" data-add="" data-qty="#q" id="addbtn">かごに入れる</button></div>
      <p id="long"></p>
      <dl><dt>作り手</dt><dd id="maker"></dd><dt>寸法</dt><dd id="size"></dd><dt>重さ</dt><dd id="w"></dd><dt>お届け</dt><dd>ご注文から3営業日以内に発送</dd></dl>
      <p class="care" id="care"></p>
    </div>
  </div>
</section>
<section class="rel"><h2>ほかのうつわ</h2><div class="grid" id="rel"></div></section>
</main>
<footer class="ft"><div class="logo">土と火</div><div>© Tsuchi to Hi　｜　このページはポートフォリオ用の架空の店です。</div></footer>
<script src="cart.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');const it=ITEMS[id]||ITEMS.hakuji;const key=ITEMS[id]?id:'hakuji';
document.title=it.n+'｜土と火';document.getElementById('cname').textContent=it.n;document.getElementById('kan').textContent=it.no;
document.getElementById('h1').innerHTML=it.n+'<small>'+it.en+'</small>';document.getElementById('price').innerHTML=it.p.toLocaleString()+'<small>円（税込）</small>';
const st=document.getElementById('stock');st.textContent=it.stock<=2?`残り ${it.stock}点`:`在庫あり（${it.stock}点）`;st.classList.toggle('few',it.stock<=2);
document.getElementById('long').textContent=it.long;document.getElementById('maker').textContent=it.maker;document.getElementById('size').textContent=it.size;document.getElementById('w').textContent=it.w;document.getElementById('care').textContent='手入れ：'+it.care;
const imgs=[it.img,'assets/maker-hands.jpg','assets/hero.jpg'];const main=document.getElementById('mainimg');main.src=imgs[0];main.alt=it.n;
document.getElementById('thumbs').innerHTML=imgs.map((s,i)=>`<button type="button" class="${i?'':'on'}" data-s="${s}"><img src="${s}" alt=""></button>`).join('');
document.querySelectorAll('#thumbs button').forEach(b=>b.addEventListener('click',()=>{main.src=b.dataset.s;document.querySelectorAll('#thumbs button').forEach(x=>x.classList.toggle('on',x===b))}));
const q=document.getElementById('q');q.max=it.stock;document.getElementById('inc').addEventListener('click',()=>{q.value=Math.min(+q.value+1,it.stock)});document.getElementById('dec').addEventListener('click',()=>{q.value=Math.max(+q.value-1,1)});
document.getElementById('addbtn').dataset.add=key;
document.getElementById('rel').innerHTML=Object.entries(ITEMS).filter(([k])=>k!==key).slice(0,5).map(([k,x])=>`<a href="item.html?id=${k}"><div class="im"><img src="${x.img}" alt="" loading="lazy"></div><b>${x.n}</b><small>${x.p.toLocaleString()}円</small></a>`).join('');
mountCart();
</script>
</body>
</html>
