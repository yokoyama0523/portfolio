<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面｜ASAGI</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../site.css"><script src="../data.js"></script><script src="../store.js"></script>
<style>
body{background:#f6f6f4}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login form{background:#fff;padding:32px;width:min(380px,100%);border:1px solid var(--line)}.login h1{font-size:16px;font-weight:500;margin-bottom:6px}.login .f{grid-template-columns:1fr}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.sb{background:#1b1b1b;color:#ddd;padding:20px 16px;position:sticky;top:0;height:100vh}
.sb .logo{font-family:'Inter',var(--f);font-weight:700;letter-spacing:.14em;color:#fff;font-size:16px;padding:6px 10px 18px}
.sb a{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:13px;color:#bbb;border-radius:4px}.sb a[aria-current]{background:#333;color:#fff}.sb a:hover{color:#fff}
.sb .ft{position:absolute;bottom:20px;left:16px;right:16px;font-size:11px;color:#888;border:0;margin:0;padding:0}.sb .ft a{padding:4px 12px;font-size:12px}
.mainp{padding:24px 28px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{font-size:18px;font-weight:500}.top .d{font-size:12px;color:var(--mute)}
.view{display:none}.view.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}.kpi{background:#fff;border:1px solid var(--line);padding:16px 18px}.kpi small{font-size:11.5px;color:var(--mute);display:block}.kpi b{font-family:'Inter',var(--f);font-size:24px;font-weight:600;display:block;margin-top:4px;letter-spacing:-.01em}.kpi i{font-style:normal;font-size:11px;color:var(--ok)}.kpi i.dn{color:var(--sale)}
.pnl{background:#fff;border:1px solid var(--line);padding:18px 20px;margin-bottom:16px}.pnl h2{font-size:13.5px;font-weight:500;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.two{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.chart{width:100%;height:200px}.chart rect{fill:#1b1b1b}.chart rect.w{fill:#9a9a98}.chart text{font-size:10px;fill:#888;font-family:var(--f)}.chart line{stroke:#e4e4e2}
.tb td input,.tb td select{margin:0;padding:5px 8px;font-size:12.5px;width:auto}
.tb td input[type=number]{width:64px}
.tb tr.low td{background:#fff7e6}.tb tr.out td{background:#fdecea}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}.tools input,.tools select{margin:0;padding:7px 10px;font-size:12.5px;width:auto}
.dt{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:#fff;z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .35s;padding:24px;overflow:auto}.dt.on{transform:none}.dt h2{font-size:15px;font-weight:500;margin-bottom:12px}.dt .x{position:absolute;right:20px;top:22px;font-size:12.5px}
.dt dl{display:grid;grid-template-columns:7em 1fr;gap:6px 12px;font-size:12.5px}.dt dt{color:var(--mute)}
.dt .it{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;align-items:center}.dt .it img{aspect-ratio:3/4;object-fit:cover;background:var(--bg)}
.ok{color:var(--ok)}
@media (max-width:900px){.app{grid-template-columns:1fr}.sb{position:static;height:auto;padding:12px}.sb nav{display:flex;flex-wrap:wrap;gap:4px}.sb .ft{display:none}.kpis{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.mainp{padding:16px}}
@media (prefers-reduced-motion:reduce){.dt{transition:none}}
</style>
</head>
<body>
<div class="login" id="login">
  <form id="lf" novalidate><h1>ASAGI 管理画面</h1><p class="note" style="margin-bottom:14px">デモ：ID <b style="font-weight:500">admin</b>　パスワード <b style="font-weight:500">asagi</b></p>
    <div class="f"><div><label class="t" for="aid">ID</label><input type="text" id="aid" value="admin"></div><div><label class="t" for="apw">パスワード</label><input type="password" id="apw" value="asagi"></div><div class="note" id="amsg" style="color:var(--sale)"></div><div><button type="submit" class="btn full">ログイン</button></div></div>
    <p class="note" style="margin-top:14px"><a href="../" style="border-bottom:1px solid var(--line)">店のページへ戻る</a></p></form>
</div>
<div class="app" id="app" hidden>
  <aside class="sb"><div class="logo">ASAGI</div><nav aria-label="管理"><a href="#dash">ダッシュボード</a><a href="#orders">注文</a><a href="#stock">商品・在庫</a><a href="#customers">顧客</a><a href="#settings">設定</a></nav><div class="ft"><a href="../" target="_blank" rel="noopener">店のページを開く</a><a href="#" id="alogout">ログアウト</a></div></aside>
  <main class="mainp">
    <div class="top"><h1 id="vt">ダッシュボード</h1><span class="d" id="now"></span></div>
    <section class="view" id="v-dash">
      <div class="kpis" id="kpis"></div>
      <div class="two"><div class="pnl"><h2>売上（30日）<span class="note" id="c30"></span></h2><svg class="chart" id="chart" viewBox="0 0 600 200" preserveAspectRatio="none" role="img" aria-label="30日の売上の棒グラフ"></svg></div><div class="pnl"><h2>対応が要る注文</h2><div id="todo"></div></div></div>
      <div class="two"><div class="pnl"><h2>最近の注文<a href="#orders" style="font-size:12px;border-bottom:1px solid var(--ink)">すべて</a></h2><table class="tb" id="recent"></table></div><div class="pnl"><h2>売れ筋（30日）</h2><table class="tb" id="best"></table></div></div>
    </section>
    <section class="view" id="v-orders">
      <div class="tools"><input type="search" id="oq" placeholder="注文番号・氏名・メール"><select id="ost"><option value="">すべての状態</option><option>受付</option><option>発送準備</option><option>発送済</option><option>完了</option><option>キャンセル</option></select><select id="opay"><option value="">すべての支払い</option><option value="card">クレジットカード</option><option value="cvs">コンビニ払い</option><option value="cod">代金引換</option></select><span class="note" id="ocnt"></span><button type="button" class="btn g sm" id="ocsv" style="margin-left:auto">CSVを書き出す</button></div>
      <div class="pnl"><table class="tb" id="otable"></table></div>
    </section>
    <section class="view" id="v-stock">
      <div class="tools"><input type="search" id="sq" placeholder="商品名"><select id="scat"><option value="">すべてのカテゴリー</option></select><label style="font-size:12.5px;display:flex;align-items:center;gap:6px"><input type="checkbox" id="slow" style="accent-color:var(--ink)">在庫3以下だけ</label><span class="note" id="scnt"></span></div>
      <div class="pnl"><table class="tb" id="stable"></table></div>
    </section>
    <section class="view" id="v-customers"><div class="pnl"><table class="tb" id="ctable"></table></div></section>
    <section class="view" id="v-settings">
      <div class="pnl"><h2>送料</h2><div class="f" style="max-width:520px"><div><label class="t">送料（税込）</label><input type="number" id="sship"></div><div><label class="t">送料無料になる金額</label><input type="number" id="sfree"></div><div class="w"><button type="button" class="btn sm" id="ssave">保存する</button> <span class="note" id="smsg"></span></div></div></div>
      <div class="pnl"><h2>クーポン</h2><table class="tb" id="cptable"></table><div class="tools" style="margin-top:12px"><input type="text" id="cpcode" placeholder="コード（例 AUTUMN5）" style="text-transform:uppercase"><select id="cptype"><option value="rate">割引率（%）</option><option value="ship">送料無料</option></select><input type="number" id="cpval" placeholder="10" style="width:80px"><input type="text" id="cplabel" placeholder="表示名"><button type="button" class="btn sm" id="cpadd">追加</button></div></div>
      <div class="pnl"><h2>デモのデータ</h2><p class="note">このデモはブラウザの中（localStorage）だけで動いています。注文・在庫・会員・設定をはじめの状態に戻すには、下のボタンを押してください。</p><button type="button" class="btn g sm" id="reset" style="margin-top:10px">はじめの状態に戻す</button></div>
    </section>
  </main>
</div>
<aside class="dt" id="dt" aria-label="注文の詳細"><button type="button" class="x" id="dtx">閉じる</button><div id="dtbody"></div></aside>
<script>
const imgA=n=>'../assets/'+n+'.jpg';
const PAY={card:'カード',cvs:'コンビニ',cod:'代引'};
const S=DB.get('settings',{ship:SHOP.ship,freeShip:SHOP.freeShip,coupons:SHOP.coupons});
function auth(){const on=DB.get('admin',false);q('#login').hidden=on;q('#app').hidden=!on;if(on)route();}
document.forms.lf.addEventListener('submit',e=>{e.preventDefault();if(q('#aid').value.trim()==='admin'&&q('#apw').value==='asagi'){DB.set('admin',true);auth();}else q('#amsg').textContent='IDかパスワードが違います。';});
q('#alogout').addEventListener('click',e=>{e.preventDefault();DB.set('admin',false);auth();});
const T=['ダッシュボード','注文','商品・在庫','顧客','設定'],V=['dash','orders','stock','customers','settings'];
function route(){const h=(location.hash||'#dash').replace('#','');const i=Math.max(0,V.indexOf(h));qa('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+V[i]));qa('.sb nav a').forEach(a=>{if(a.getAttribute('href')==='#'+V[i])a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});q('#vt').textContent=T[i];const d=new Date();q('#now').textContent=`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 更新`;({dash,orders,stockv,customers,settings})[['dash','orders','stockv','customers','settings'][i]]();}
window.addEventListener('hashchange',route);
const live=()=>Orders.all().filter(o=>o.status!=='キャンセル');
function dayKey(s){return s.slice(0,10);}
function dash(){const os=Orders.all();const d0=new Date();const key=ymd(d0);const m=key.slice(0,7);
  const sum=l=>l.reduce((a,o)=>a+o.total,0);const td=live().filter(o=>dayKey(o.at)===key),mo=live().filter(o=>o.at.slice(0,7)===m);
  const y=new Date(d0);y.setDate(d0.getDate()-1);const yd=live().filter(o=>dayKey(o.at)===ymd(y));
  const last30=live().filter(o=>(d0-new Date(o.at))/864e5<=30);const prev30=live().filter(o=>{const dd=(d0-new Date(o.at))/864e5;return dd>30&&dd<=60;});
  const pct=(a,b)=>b?Math.round((a-b)/b*100):0;const p30=pct(sum(last30),sum(prev30));
  let outSku=0;PRODUCTS.forEach(p=>p.v.forEach(v=>p.sizes.forEach(s=>{if(stock(p.id,v.c,s)===0)outSku++;})));
  q('#kpis').innerHTML=[['今日の売上',yen(sum(td)),`${td.length}件　／　前日 ${yen(sum(yd))}`],['今月の売上',yen(sum(mo)),`${mo.length}件`],['30日の売上',yen(sum(last30)),`<i class="${p30<0?'dn':''}">${p30>=0?'+':''}${p30}%</i> 前の30日比`],['平均注文額',yen(last30.length?sum(last30)/last30.length:0),'30日'],['在庫切れ',outSku+' SKU',`<a href="#stock" style="border-bottom:1px solid var(--line)">在庫を見る</a>`]].map(([t,v,s])=>`<div class="kpi"><small>${t}</small><b>${v}</b><small>${s}</small></div>`).join('');
  const days=Array.from({length:30},(_,i)=>{const d=new Date(d0);d.setDate(d0.getDate()-29+i);return ymd(d);});const vals=days.map(k=>sum(live().filter(o=>dayKey(o.at)===k)));const mx=Math.max(1,...vals);
  q('#c30').textContent=`合計 ${yen(vals.reduce((a,b)=>a+b,0))}`;
  q('#chart').innerHTML=[0,.5,1].map(r=>`<line x1="0" x2="600" y1="${170-150*r}" y2="${170-150*r}"/>`).join('')+vals.map((v,i)=>`<rect x="${i*20+3}" y="${170-150*v/mx}" width="14" height="${150*v/mx}" class="${i===29?'':'w'}"><title>${days[i]} ${yen(v)}</title></rect>`).join('')+days.filter((_,i)=>i%7===1).map((k,j)=>`<text x="${(j*7+1)*20+3}" y="188">${k.slice(5).replace('-','/')}</text>`).join('')+`<text x="600" y="12" text-anchor="end">最大 ${yen(mx)}</text>`;
  const todo=[['受付（未処理）',os.filter(o=>o.status==='受付').length,'#orders'],['発送準備中',os.filter(o=>o.status==='発送準備').length,'#orders'],['コンビニ払い・入金待ち',os.filter(o=>o.pay==='cvs'&&o.status==='受付').length,'#orders'],['在庫3以下のSKU',(()=>{let n=0;PRODUCTS.forEach(p=>p.v.forEach(v=>p.sizes.forEach(s=>{const k=stock(p.id,v.c,s);if(k>0&&k<=3)n++;})));return n;})(),'#stock']];
  q('#todo').innerHTML=`<table class="tb">${todo.map(([t,n,h])=>`<tr><td>${t}</td><td class="r"><a href="${h}" style="font-family:Inter;font-weight:600;font-size:16px">${n}</a></td></tr>`).join('')}</table>`;
  q('#recent').innerHTML=`<thead><tr><th>注文番号</th><th>日時</th><th>氏名</th><th class="r">金額</th><th>状態</th></tr></thead><tbody>${[...os].sort((a,b)=>b.at.localeCompare(a.at)).slice(0,6).map(o=>`<tr><td><a href="#orders" data-open="${o.no}" style="font-family:Inter;font-weight:500">${o.no}</a></td><td>${o.at.slice(5,16).replace('T',' ').replace('-','/')}</td><td>${esc(o.name)}</td><td class="r">${yen(o.total)}</td><td><span class="pill ${o.status}">${o.status}</span></td></tr>`).join('')}</tbody>`;
  const cnt={};last30.forEach(o=>o.items.forEach(x=>{cnt[x.id]=(cnt[x.id]||0)+x.qty;}));
  q('#best').innerHTML=`<thead><tr><th>商品</th><th class="r">点数</th><th class="r">在庫</th></tr></thead><tbody>${Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([id,n])=>`<tr><td>${esc(P[id]?P[id].name:id)}</td><td class="r">${n}</td><td class="r">${P[id]?productStock(P[id]):'-'}</td></tr>`).join('')}</tbody>`;
  qa('[data-open]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();location.hash='#orders';setTimeout(()=>openOrder(a.dataset.open),50);}));}
function orders(){const k=(q('#oq').value||'').toLowerCase(),st=q('#ost').value,pay=q('#opay').value;const os=[...Orders.all()].sort((a,b)=>b.at.localeCompare(a.at)).filter(o=>(!st||o.status===st)&&(!pay||o.pay===pay)&&(!k||(o.no+o.name+o.email).toLowerCase().includes(k)));q('#ocnt').textContent=`${os.length}件`;
  q('#otable').innerHTML=`<thead><tr><th>注文番号</th><th>日時</th><th>氏名</th><th>点数</th><th class="r">金額</th><th>支払い</th><th>状態</th><th>追跡番号</th></tr></thead><tbody>${os.map(o=>`<tr><td><a href="#" data-open="${o.no}" style="font-family:Inter;font-weight:500;border-bottom:1px solid var(--line)">${o.no}</a></td><td>${o.at.slice(0,16).replace('T',' ').replace(/-/g,'/')}</td><td>${esc(o.name)}</td><td>${o.items.reduce((a,x)=>a+x.qty,0)}</td><td class="r">${yen(o.total)}</td><td>${PAY[o.pay]||o.pay}</td><td><select data-st="${o.no}" aria-label="状態">${['受付','発送準備','発送済','完了','キャンセル'].map(s=>`<option${s===o.status?' selected':''}>${s}</option>`).join('')}</select></td><td><input type="text" data-tr="${o.no}" value="${esc(o.tracking||'')}" placeholder="伝票番号" style="width:120px;font-family:Inter"></td></tr>`).join('')}</tbody>`;
  qa('[data-open]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();openOrder(a.dataset.open);}));
  qa('[data-st]').forEach(s=>s.addEventListener('change',()=>{const o=Orders.all().find(x=>x.no===s.dataset.st);if(s.value==='キャンセル'&&o.status!=='キャンセル')o.items.forEach(it=>setStock(it.id,it.c,it.s,stock(it.id,it.c,it.s)+it.qty));Orders.update(s.dataset.st,{status:s.value});toast(`${s.dataset.st} を「${s.value}」にしました`);}));
  qa('[data-tr]').forEach(i=>i.addEventListener('change',()=>{Orders.update(i.dataset.tr,{tracking:i.value.trim()});toast('追跡番号を保存しました');}));}
['oq','ost','opay'].forEach(id=>q('#'+id).addEventListener('input',orders));
q('#ocsv').addEventListener('click',()=>{const rows=[['注文番号','日時','氏名','メール','金額','支払い','状態','追跡番号','商品']].concat(Orders.all().map(o=>[o.no,o.at,o.name,o.email,o.total,PAY[o.pay]||o.pay,o.status,o.tracking||'',o.items.map(x=>`${P[x.id]?P[x.id].name:x.id} ${x.c}/${x.s}×${x.qty}`).join('; ')]));const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='orders.csv';a.click();});
function openOrder(no){const o=Orders.all().find(x=>x.no===no);if(!o)return;q('#dtbody').innerHTML=`<h2>${o.no}</h2><dl><dt>日時</dt><dd>${o.at.slice(0,16).replace('T',' ')}</dd><dt>状態</dt><dd><span class="pill ${o.status}">${o.status}</span></dd><dt>氏名</dt><dd>${esc(o.name)}</dd><dt>メール</dt><dd>${esc(o.email)}</dd><dt>お届け先</dt><dd>〒${esc(o.addr.zip)} ${esc(o.addr.pref)}${esc(o.addr.addr1)} ${esc(o.addr.addr2||'')}<br>${esc(o.addr.tel)}</dd><dt>配送</dt><dd>${o.delivery.date==='指定なし'?'指定なし':o.delivery.date}　${esc(o.delivery.time)}${o.gift?'　ギフト包装':''}</dd><dt>支払い</dt><dd>${PAY[o.pay]||o.pay}</dd><dt>追跡番号</dt><dd>${esc(o.tracking||'—')}</dd></dl><div style="margin-top:14px">${o.items.map(x=>{const p=P[x.id];const v=p?(p.v.find(v=>v.c===x.c)||p.v[0]):null;return `<div class="it"><img src="${v?imgA(v.img[0]):''}" alt=""><div>${p?esc(p.name):x.id}<br><span class="note">${esc(x.c)}／${esc(x.s)}　×${x.qty}</span></div><div>${yen(x.price*x.qty)}</div></div>`;}).join('')}</div><dl style="margin-top:12px;border-top:1px solid var(--ink);padding-top:10px"><dt>小計</dt><dd>${yen(o.sub)}</dd>${o.discount?`<dt>クーポン</dt><dd>−${yen(o.discount)}（${o.coupon||''}）</dd>`:''}<dt>送料</dt><dd>${yen(o.ship)}</dd>${o.cod?`<dt>代引手数料</dt><dd>${yen(o.cod)}</dd>`:''}${o.gift?`<dt>包装</dt><dd>${yen(o.gift)}</dd>`:''}<dt><b>合計</b></dt><dd><b style="font-weight:500">${yen(o.total)}</b></dd></dl>`;q('#dt').classList.add('on');}
q('#dtx').addEventListener('click',()=>q('#dt').classList.remove('on'));document.addEventListener('keydown',e=>{if(e.key==='Escape')q('#dt').classList.remove('on');});
q('#scat').innerHTML+=CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
function stockv(){const k=(q('#sq').value||'').toLowerCase(),cat=q('#scat').value,low=q('#slow').checked;let rows=[],n=0;
  PRODUCTS.filter(p=>(!cat||p.cat===cat)&&(!k||p.name.toLowerCase().includes(k))).forEach(p=>p.v.forEach(v=>p.sizes.forEach(s=>{const st=stock(p.id,v.c,s);if(low&&st>3)return;n++;rows.push(`<tr class="${st===0?'out':st<=3?'low':''}"><td><img src="${imgA(v.img[0])}" alt="" style="width:32px;aspect-ratio:3/4;object-fit:cover;background:var(--bg)"></td><td>${esc(p.name)}</td><td>${esc(v.c)}</td><td>${s}</td><td class="r">${yen(price(p))}</td><td><input type="number" min="0" value="${st}" data-sk="${p.id}|${v.c}|${s}" aria-label="在庫"></td><td>${st===0?'<span class="pill キャンセル">売り切れ</span>':st<=3?'<span class="pill 受付">残りわずか</span>':''}</td></tr>`);})));
  q('#scnt').textContent=`${n} SKU`;q('#stable').innerHTML=`<thead><tr><th></th><th>商品</th><th>色</th><th>サイズ</th><th class="r">価格</th><th>在庫</th><th></th></tr></thead><tbody>${rows.join('')}</tbody>`;
  qa('[data-sk]').forEach(i=>i.addEventListener('change',()=>{const [id,c,s]=i.dataset.sk.split('|');setStock(id,c,s,+i.value);const tr=i.closest('tr');const st=+i.value;tr.className=st===0?'out':st<=3?'low':'';toast('在庫を保存しました');}));}
['sq','scat','slow'].forEach(id=>q('#'+id).addEventListener('input',stockv));
function customers(){const us=Auth.users();const os=Orders.all();const rows=Object.entries(us).map(([e,u])=>{const mine=os.filter(o=>o.email===e&&o.status!=='キャンセル');return {e,u,n:mine.length,sum:mine.reduce((a,o)=>a+o.total,0),last:mine.length?mine.map(o=>o.at).sort().pop():''};}).sort((a,b)=>b.sum-a.sum);
  q('#ctable').innerHTML=`<thead><tr><th>氏名</th><th>メール</th><th>登録日</th><th class="r">注文回数</th><th class="r">累計金額</th><th>最終注文</th><th>お届け先</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.u.name)}</td><td>${esc(r.e)}</td><td>${r.u.since||''}</td><td class="r">${r.n}</td><td class="r">${yen(r.sum)}</td><td>${r.last?r.last.slice(0,10):'—'}</td><td>${(r.u.addresses||[]).length}件</td></tr>`).join('')}</tbody>`;}
function settings(){q('#sship').value=S.ship;q('#sfree').value=S.freeShip;q('#cptable').innerHTML=`<thead><tr><th>コード</th><th>内容</th><th>表示名</th><th></th></tr></thead><tbody>${Object.entries(S.coupons).map(([c,v])=>`<tr><td style="font-family:Inter;font-weight:500">${c}</td><td>${v.type==='rate'?v.value+'% OFF':'送料無料'}</td><td>${esc(v.label)}</td><td><button type="button" data-cpdel="${c}" style="font-size:11.5px;color:var(--sale)">削除</button></td></tr>`).join('')}</tbody>`;qa('[data-cpdel]').forEach(b=>b.addEventListener('click',()=>{delete S.coupons[b.dataset.cpdel];saveS();settings();}));}
function saveS(){DB.set('settings',S);SHOP.ship=S.ship;SHOP.freeShip=S.freeShip;SHOP.coupons=S.coupons;}
q('#ssave').addEventListener('click',()=>{S.ship=+q('#sship').value||0;S.freeShip=+q('#sfree').value||0;saveS();q('#smsg').textContent='保存しました';});
q('#cpadd').addEventListener('click',()=>{const c=q('#cpcode').value.trim().toUpperCase();if(!c)return;S.coupons[c]={type:q('#cptype').value,value:+q('#cpval').value||0,label:q('#cplabel').value.trim()||c};saveS();settings();q('#cpcode').value='';});
q('#reset').addEventListener('click',()=>{if(!confirm('注文・在庫・会員・設定をはじめの状態に戻します。よろしいですか？'))return;Object.keys(localStorage).filter(k=>k.startsWith('asagi_')).forEach(k=>localStorage.removeItem(k));location.reload();});
saveS();auth();
</script>
</body>
