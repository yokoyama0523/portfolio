<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品一覧｜ASAGI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"><link rel="stylesheet" href="site.css"><script src="data.js"></script><script src="store.js"></script>
<style>
.lay{display:grid;grid-template-columns:220px 1fr;gap:clamp(24px,4vw,56px);align-items:start}
.side{position:sticky;top:80px}
.side h3{font-size:12px;font-weight:500;letter-spacing:.08em;margin:0 0 8px;padding-top:18px;border-top:1px solid var(--line)}
.side h3:first-child{border-top:0;padding-top:0}
.side label{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;cursor:pointer}
.side input[type=checkbox],.side input[type=radio]{accent-color:var(--ink);margin:0;width:14px;height:14px}
.side .sw{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:inline-block}
.side .sizes{display:flex;flex-wrap:wrap;gap:6px}.side .sizes label{border:1px solid var(--line);padding:4px 10px;gap:0}.side .sizes label:has(input:checked){border-color:var(--ink);background:var(--ink);color:#fff}.side .sizes input{position:absolute;opacity:0;width:0;height:0}
.side .clear{font-size:11.5px;color:var(--mute);border-bottom:1px solid var(--line);margin-top:18px;display:inline-block}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0 22px;flex-wrap:wrap}
.bar .cnt{font-size:12.5px}.bar .cnt b{font-weight:500;font-size:16px;margin-right:2px}
.bar select{margin:0;width:auto;padding:7px 28px 7px 10px;font-size:12.5px;border-color:var(--line);appearance:none;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23141414" stroke-width="1.6"><path d="M6 9l6 6 6-6"/></svg>') no-repeat right 8px center/14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{font-size:11.5px;border:1px solid var(--line);padding:3px 10px;border-radius:999px}.chips button::after{content:" ×";color:var(--mute)}
.pg{display:flex;justify-content:center;gap:6px;margin-top:40px}.pg a,.pg span{min-width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);font-size:12.5px}.pg [aria-current]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fbtn{display:none}
@media (max-width:900px){.lay{grid-template-columns:1fr}.side{display:none;position:fixed;inset:0;z-index:50;background:#fff;overflow:auto;padding:20px var(--gut) 100px}.filter-open .side{display:block}.side .close{display:block;margin-left:auto;font-size:12.5px;border:1px solid var(--line);padding:6px 12px}.fbtn{display:inline-flex}.side .apply{position:fixed;left:var(--gut);right:var(--gut);bottom:16px}}
@media (min-width:901px){.side .close,.side .apply{display:none}}
</style>
</head>
<body>
<div id="hd"></div>
<main class="wrap">
  <nav class="bc" aria-label="現在地"><a href="index.html">ホーム</a><span>／</span><span id="bc"></span></nav>
  <h1 class="ttl" id="ttl">商品一覧</h1>
  <p class="note" id="lead"></p>
  <div class="lay">
    <aside class="side" id="side" aria-label="絞り込み">
      <button type="button" class="close" id="fclose">閉じる</button>
      <h3>カテゴリー</h3><div id="fcat"></div>
      <h3>カラー</h3><div id="fcolor"></div>
      <h3>サイズ</h3><div class="sizes" id="fsize"></div>
      <h3>価格</h3><div id="fprice"></div>
      <h3>在庫</h3><label><input type="checkbox" id="finstock">在庫ありのみ</label>
      <a class="clear" href="list.html">絞り込みをすべて外す</a>
      <button type="button" class="btn full apply" id="fapply">この条件で見る</button>
    </aside>
    <div>
      <div class="bar">
        <div class="cnt"><b id="cnt">0</b>件</div>
        <div class="chips" id="chips"></div>
        <div style="display:flex;gap:8px;align-items:center"><button type="button" class="btn g sm fbtn" id="fopen">絞り込み</button><select id="sort" aria-label="並べ替え"><option value="rec">おすすめ順</option><option value="new">新着順</option><option value="rank">人気順</option><option value="asc">価格が安い順</option><option value="desc">価格が高い順</option></select></div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="none" hidden>条件に合う商品がありません。<br>絞り込みを減らしてみてください。</div>
      <nav class="pg" id="pg" aria-label="ページ"></nav>
    </div>
  </div>
</main>
<div id="ft"></div>
<script>
const sp=new URLSearchParams(location.search);
const F={cat:sp.get('cat')||'',q:(sp.get('q')||'').trim(),new:sp.get('new')==='1',sale:sp.get('sale')==='1',colors:(sp.get('color')||'').split(',').filter(Boolean),sizes:(sp.get('size')||'').split(',').filter(Boolean),price:sp.get('price')||'',instock:sp.get('instock')==='1',sort:sp.get('sort')||'rec',page:+(sp.get('page')||1)};
const PRICES=[['','すべて'],['0-5000','〜5,000円'],['5000-10000','5,000〜10,000円'],['10000-20000','10,000〜20,000円'],['20000-','20,000円〜']];
const title=F.q?`「${F.q}」の検索結果`:F.new?'新着':F.sale?'セール':F.cat?catName(F.cat):'すべての商品';
document.title=title+'｜ASAGI';q('#ttl').textContent=title;q('#bc').textContent=title;
q('#lead').textContent=F.sale?'表示の価格はセール価格（税込）です。':F.new?'この2か月に入荷した商品です。':'';
function build(){
  const url=(patch)=>{const o={...F,...patch};const u=new URLSearchParams();if(o.cat)u.set('cat',o.cat);if(o.q)u.set('q',o.q);if(o.new)u.set('new','1');if(o.sale)u.set('sale','1');if(o.colors.length)u.set('color',o.colors.join(','));if(o.sizes.length)u.set('size',o.sizes.join(','));if(o.price)u.set('price',o.price);if(o.instock)u.set('instock','1');if(o.sort!=='rec')u.set('sort',o.sort);if(o.page>1)u.set('page',o.page);return 'list.html?'+u;};
  window.urlOf=url;
  q('#fcat').innerHTML=[['','すべて'],...CATS.map(c=>[c.id,c.name])].map(([id,n])=>`<label><input type="radio" name="cat" value="${id}"${F.cat===id?' checked':''}>${n}</label>`).join('');
  const colors=[...new Set(PRODUCTS.flatMap(p=>p.v.map(v=>v.c)))];
  q('#fcolor').innerHTML=colors.map(c=>`<label><input type="checkbox" name="color" value="${c}"${F.colors.includes(c)?' checked':''}><i class="sw" style="background:${COLOR_HEX[c]||'#ccc'}"></i>${c}</label>`).join('');
  const sizes=[...new Set(PRODUCTS.flatMap(p=>p.sizes))];
  q('#fsize').innerHTML=sizes.map(s=>`<label><input type="checkbox" name="size" value="${s}"${F.sizes.includes(s)?' checked':''}>${s}</label>`).join('');
  q('#fprice').innerHTML=PRICES.map(([v,n])=>`<label><input type="radio" name="price" value="${v}"${F.price===v?' checked':''}>${n}</label>`).join('');
  q('#finstock').checked=F.instock;q('#sort').value=F.sort;
  const go=()=>{F.cat=(q('input[name=cat]:checked')||{}).value||'';F.colors=qa('input[name=color]:checked').map(i=>i.value);F.sizes=qa('input[name=size]:checked').map(i=>i.value);F.price=(q('input[name=price]:checked')||{}).value||'';F.instock=q('#finstock').checked;F.page=1;location.href=url({});};
  if(matchMedia('(min-width:901px)').matches)qa('#side input').forEach(i=>i.addEventListener('change',go));
  q('#fapply').addEventListener('click',go);
  q('#sort').addEventListener('change',e=>{location.href=url({sort:e.target.value,page:1})});
  q('#fopen').addEventListener('click',()=>document.body.classList.add('filter-open'));q('#fclose').addEventListener('click',()=>document.body.classList.remove('filter-open'));
}
function run(){
  let list=PRODUCTS.filter(p=>(!F.cat||p.cat===F.cat)&&(!F.new||p.new)&&(!F.sale||p.sale)&&(!F.colors.length||p.v.some(v=>F.colors.includes(v.c)))&&(!F.sizes.length||p.sizes.some(s=>F.sizes.includes(s)))&&(!F.instock||productStock(p)>0));
  if(F.q){const k=F.q.toLowerCase();list=list.filter(p=>(p.name+p.desc+p.mat+catName(p.cat)+p.v.map(v=>v.c).join()).toLowerCase().includes(k));}
  if(F.price){const [a,b]=F.price.split('-').map(Number);list=list.filter(p=>price(p)>=a&&(!b||price(p)<b));}
  const by={rec:(a,b)=>(b.new?1:0)-(a.new?1:0)||a.rank-b.rank,new:(a,b)=>(b.new?1:0)-(a.new?1:0)||a.rank-b.rank,rank:(a,b)=>a.rank-b.rank,asc:(a,b)=>price(a)-price(b),desc:(a,b)=>price(b)-price(a)}[F.sort]||((a,b)=>0);
  list.sort(by);
  const per=12,pages=Math.max(1,Math.ceil(list.length/per));F.page=Math.min(F.page,pages);
  q('#cnt').textContent=list.length;q('#none').hidden=list.length>0;
  q('#grid').innerHTML=list.slice((F.page-1)*per,F.page*per).map(p=>card(p)).join('');bindWish(q('#grid'));
  q('#pg').innerHTML=pages>1?Array.from({length:pages},(_,i)=>i+1).map(n=>n===F.page?`<span aria-current="page">${n}</span>`:`<a href="${urlOf({page:n})}">${n}</a>`).join(''):'';
  const chips=[];F.colors.forEach(c=>chips.push([c,{colors:F.colors.filter(x=>x!==c)}]));F.sizes.forEach(s=>chips.push(['サイズ '+s,{sizes:F.sizes.filter(x=>x!==s)}]));if(F.price)chips.push([PRICES.find(x=>x[0]===F.price)[1],{price:''}]);if(F.instock)chips.push(['在庫あり',{instock:false}]);if(F.q)chips.push(['検索: '+F.q,{q:''}]);
  q('#chips').innerHTML=chips.map(([t,patch],i)=>`<button type="button" data-i="${i}">${esc(t)}</button>`).join('');qa('#chips button').forEach((b,i)=>b.addEventListener('click',()=>location.href=urlOf({...chips[i][1],page:1})));
}
build();run();
</script>
</body>
</html>
